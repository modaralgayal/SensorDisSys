apiVersion: v1
kind: Service
metadata: 
  name: sensornode
spec: 
  clusterIP: None
  selector:
    app: sensornode
  ports:
    - port: 5000

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sensornode
spec:
  serviceName: sensornode
  replicas: 3
  selector:
    matchLabels:
      app: sensornode
  
  template:
    metadata:
      labels:
        app: sensornode
    
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: node 
          image: sensordissys-server:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              ID=${HOSTNAME##*-}
              PEERS=$(grep "^$ID " /config/topology.txt | cut -d' ' -f2-)
              exec ./build/SensorDisSys 5000 $PEERS
          volumeMounts:
            - name: topology
              mountPath: /config
      volumes:
        - name: topology
          configMap:
            name: swarm-topology